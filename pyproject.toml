[project]
name = "myfem"
version = "0.1.0"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "pynitefea>=3.2.1",
    "pyside6>=6.12.0",
]

[project.gui-scripts]
myfem = "myfem.gui.__main__:main"
"myfem.run" = "myfem.gui.__main__:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["myfem*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
